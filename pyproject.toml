[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dealix"
version = "1.0.0"
description = "Personalized, forecast-based financial affordability agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "anthropic>=0.40,<1",
    "redis>=5,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "fakeredis>=2.21,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dealix = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
